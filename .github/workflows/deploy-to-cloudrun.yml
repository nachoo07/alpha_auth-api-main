name: CI/CD Pipeline (Multi-Environment)

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  id-token: write

env:
  # --- CONFIGURACIÓN DE NOMBRES (CAMBIAR ESTO SEGÚN EL REPO) ---
  REPO_NAME: auth-api-main   # OJO: Cambiar a "ui-repo" en el otro proyecto
  IMAGE_NAME: auth-api       # OJO: Cambiar a "ui" en el otro proyecto
  REGION: us-central1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. DETECTAR AMBIENTE Y SELECCIONAR MÉTODO DE AUTH
      - name: Set Environment Config
        id: env-config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "🔥 ENVIRONMENT: PRODUCTION"
            echo "AUTH_METHOD=wif" >> $GITHUB_ENV
            echo "GCP_PROJECT=${{ secrets.PROD_GCP_PROJECT_ID }}" >> $GITHUB_ENV
            # Variables de Prod (WIF)
            echo "WIF_PROVIDER=${{ secrets.PROD_WIF_PROVIDER }}" >> $GITHUB_ENV
            echo "SERVICE_ACCOUNT=${{ secrets.PROD_SERVICE_ACCOUNT }}" >> $GITHUB_ENV
            echo "SERVICE_NAME=${{ env.IMAGE_NAME }}-prod" >> $GITHUB_ENV
          else
            echo "🚧 ENVIRONMENT: DEVELOPMENT"
            echo "AUTH_METHOD=json" >> $GITHUB_ENV
            echo "GCP_PROJECT=${{ secrets.DEV_GCP_PROJECT_ID }}" >> $GITHUB_ENV
            # Variables de Dev (JSON Key)
            echo "SERVICE_NAME=${{ env.IMAGE_NAME }}-dev" >> $GITHUB_ENV
          fi

      # 2. AUTENTICACIÓN (HÍBRIDA)
      
      # Opción A: Auth para PROD (Usando Federation/WIF)
      - name: Authenticate to Google Cloud (Prod)
        if: env.AUTH_METHOD == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # Opción B: Auth para DEV (Usando tu nueva JSON Key)
      - name: Authenticate to Google Cloud (Dev)
        if: env.AUTH_METHOD == 'json'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEV_GCP_SA_KEY }}

      # 3. CONFIGURACIÓN Y BUILD
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push
        id: build
        run: |
          TAG="${{ github.sha }}"
          IMAGE="us-central1-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:$TAG"
          
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # 4. DESPLIEGUE
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ steps.build.outputs.image }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --quiet \
            --timeout 3600 \
            --cpu-boost \
            --use-http2 \
            --add-cloudsql-instances=${{ secrets.DB_INSTANCE_NAME }} \
            --set-env-vars="\
            DEPLOY_PLATFORM=gcp,\
            DEPLOY_ENV=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }},\
            GO_ENVIRONMENT=${{ github.ref == 'refs/heads/main' && 'production' || 'development' }},\
            GIN_MODE=release,\
            DB_TYPE=postgres,\
            DB_HOST=/cloudsql/${{ secrets.DB_INSTANCE_NAME }},\
            DB_PORT=5432,\
            DB_NAME=${{ secrets.DB_NAME }},\
            DB_USER=${{ secrets.DB_USER }},\
            DB_PASSWORD=${{ secrets.DB_PASSWORD }},\
            DB_SSL_MODE=disable,\
            SSL_MODE=disable,\
            INSTANCE_CONNECTION_NAME=${{ secrets.DB_INSTANCE_NAME }}"

 